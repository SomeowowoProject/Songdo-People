/* ============================================================
   SONGDO & PEOPLE — Stylesheet
   Design grammar: Dieter Rams ("Weniger, aber besser")
   3색만: Navy / Paper / Red  (그레이 미사용; 위계는 Navy tint로)
   ============================================================ */

:root {
  --navy:  #0D1B2A;
  --paper: #FAFAF8;
  --red:   #C8102E;
  --navy-70: rgba(13, 27, 42, 0.70);
  --navy-55: rgba(13, 27, 42, 0.55);
  --navy-14: rgba(13, 27, 42, 0.14);
  --navy-08: rgba(13, 27, 42, 0.08);
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --sans:  "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  --max: 1200px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--paper); color: var(--navy); font-family: var(--sans);
  font-size: 16px; line-height: 1.5; letter-spacing: 0.01em;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
.container { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 24px; }

.skip-link { position: absolute; left: -999px; top: 0; background: var(--navy); color: var(--paper); padding: 10px 16px; z-index: 100; font-size: 13px; }
.skip-link:focus { left: 0; }

/* ① 유틸리티 */
.utility { border-bottom: 1px solid var(--navy-14); }
.utility__inner { display: flex; align-items: center; justify-content: space-between; height: 38px; font-size: 12px; letter-spacing: 0.04em; }
.utility__date { color: var(--navy-70); text-transform: uppercase; }
.utility__right { display: flex; align-items: center; gap: 20px; }
.utility__weather { color: var(--navy-70); }
.utility__link:hover { color: var(--red); }
.utility__link--accent { color: var(--red); font-weight: 700; }

/* ② 마스트헤드 */
.masthead { border-bottom: 1px solid var(--navy); }
.masthead__inner { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 26px 24px; }
.logo { font-family: var(--serif); color: var(--navy); text-align: center; line-height: 0.92; grid-column: 2; display: flex; align-items: baseline; justify-content: center; gap: 0.28em; flex-wrap: wrap; }
.logo__line { font-weight: 600; font-size: clamp(30px, 6vw, 58px); letter-spacing: 0.04em; text-transform: uppercase; }
.logo__amp { font-style: italic; font-weight: 500; font-size: clamp(26px, 5vw, 50px); }
.nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: 0; cursor: pointer; padding: 6px; grid-column: 1; }
.nav-toggle span { width: 22px; height: 1.5px; background: var(--navy); transition: .25s; }
.nav-toggle[aria-expanded="true"] span:nth-child(1){ transform: translateY(6.5px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2){ opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3){ transform: translateY(-6.5px) rotate(-45deg); }
.search-btn { background: none; border: 0; color: var(--navy); cursor: pointer; grid-column: 3; justify-self: end; display: flex; }
.search-btn:hover { color: var(--red); }

/* ③ 내비 */
.nav { border-bottom: 1px solid var(--navy-14); }
.nav__list { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
.nav__link { display: block; padding: 13px 18px; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; position: relative; }
.nav__link::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 8px; height: 1.5px; background: var(--red); transform: scaleX(0); transform-origin: left; transition: transform .22s ease; }
.nav__link:hover::after, .nav__link.is-active::after { transform: scaleX(1); }
.nav__link.is-active { font-weight: 700; }

/* 검색바 */
.searchbar { border-bottom: 1px solid var(--navy-14); background: var(--paper); }
.searchbar__inner { display: flex; align-items: center; gap: 12px; height: 64px; }
.searchbar__input { flex: 1; border: 0; border-bottom: 1.5px solid var(--navy); background: transparent; font-family: var(--serif); font-size: 22px; padding: 8px 0; color: var(--navy); outline: none; }
.searchbar__input::placeholder { color: var(--navy-55); }
.searchbar__go { background: var(--navy); color: var(--paper); border: 0; padding: 10px 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; }
.searchbar__go:hover { background: var(--red); }
.searchbar__close { background: none; border: 0; color: var(--navy-70); font-size: 18px; cursor: pointer; padding: 8px; }
.searchbar__close:hover { color: var(--red); }

/* ④ 티커 */
.ticker { border-bottom: 1px solid var(--navy-14); }
.ticker__inner { display: flex; align-items: center; height: 44px; }
.ticker__label { flex: 0 0 auto; background: var(--red); color: var(--paper); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 14px; margin-right: 20px; text-transform: uppercase; }
.ticker__viewport { overflow: hidden; flex: 1; }
.ticker__track { display: inline-flex; gap: 56px; white-space: nowrap; animation: ticker 38s linear infinite; will-change: transform; }
.ticker:hover .ticker__track { animation-play-state: paused; }
.ticker__item { font-size: 14px; position: relative; }
.ticker__item:hover { color: var(--red); }
.ticker__item::before { content: ""; position: absolute; left: -28px; top: 50%; width: 3px; height: 3px; background: var(--red); transform: translateY(-50%); }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker__track { animation: none; } }

/* 공통 */
.kicker { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); margin-bottom: 12px; }
.kicker--sm { font-size: 11px; margin-bottom: 8px; }
.byline { font-size: 12px; color: var(--navy-55); letter-spacing: 0.03em; margin-top: 18px; }
.section { padding: 48px 0; border-top: 1px solid var(--navy-14); }
.section__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
.section__title { font-family: var(--serif); font-weight: 700; font-size: 24px; }
.section__more { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: var(--navy-70); }
.section__more:hover { color: var(--red); }

/* ⑤ 히어로 */
.hero { display: grid; grid-template-columns: 1.85fr 1fr; gap: 56px; padding: 48px 0 8px; }
.lead__title { font-family: var(--serif); font-weight: 800; font-size: clamp(34px, 5vw, 56px); line-height: 1.04; letter-spacing: -0.01em; margin-bottom: 18px; }
.lead__title a:hover { color: var(--red); }
.lead__dek { font-size: 19px; line-height: 1.55; color: var(--navy-70); max-width: 60ch; margin-bottom: 28px; }
.lead__figure { margin-top: 8px; }
.figcaption { font-size: 12px; color: var(--navy-55); padding-top: 10px; letter-spacing: 0.02em; }
.rail { border-left: 1px solid var(--navy-14); padding-left: 40px; }
.rail__item { padding-bottom: 26px; margin-bottom: 26px; border-bottom: 1px solid var(--navy-14); }
.rail__item--last { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.rail__title { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.18; margin-bottom: 10px; }
.rail__title a:hover { color: var(--red); }
.rail__dek { font-size: 15px; line-height: 1.5; color: var(--navy-70); }

/* 플레이스홀더 */
.ph { width: 100%; height: auto; background: var(--navy-08); }
.ph rect { fill: var(--navy-08); }
.ph line, .ph circle { stroke: var(--navy); stroke-width: 1.5; fill: none; }

/* ⑥ 그리드 / 카드 */
.grid { display: grid; gap: 40px; }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.card { border-top: 2px solid var(--navy); padding-top: 18px; }
.card__figure { margin-bottom: 16px; }
.card__title { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.2; margin-bottom: 10px; }
.card__title a:hover { color: var(--red); }
.card__dek { font-size: 14px; line-height: 1.5; color: var(--navy-70); }

/* ⑦ 분할 리스트 */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
.split .section__head { margin-bottom: 18px; }
.list__item { border-bottom: 1px solid var(--navy-14); }
.list__item--last { border-bottom: 0; }
.list__item a { display: block; padding: 16px 0 16px 22px; font-family: var(--serif); font-size: 19px; font-weight: 500; line-height: 1.3; position: relative; }
.list__item a::before { content: ""; position: absolute; left: 0; top: 24px; width: 8px; height: 1.5px; background: var(--red); }
.list__item a:hover { color: var(--red); }

/* ⑧ 오피니언 */
.op { border-left: 2px solid var(--red); padding-left: 22px; }
.op__quote { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 22px; line-height: 1.34; letter-spacing: -0.01em; }
.op__quote a:hover { color: var(--red); }
.op__author { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--navy-70); margin-top: 16px; }

/* ===== 신규: 빵부스러기 / 페이지 헤드 ===== */
.crumb { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 0.04em; color: var(--navy-55); padding: 24px 0 0; }
.crumb a:hover { color: var(--red); }
.crumb strong { color: var(--navy); font-weight: 600; }
.page-head { padding: 28px 0 36px; border-bottom: 2px solid var(--navy); margin-bottom: 40px; }
.page-head__title { font-family: var(--serif); font-weight: 800; font-size: clamp(36px, 6vw, 60px); letter-spacing: -0.01em; }
.page-head__count { font-size: 13px; color: var(--navy-55); letter-spacing: 0.04em; margin-top: 12px; }

/* ===== 신규: 카테고리 톱기사 ===== */
.cat-lead { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; padding-bottom: 8px; }
.cat-lead__title { font-family: var(--serif); font-weight: 800; font-size: clamp(28px, 4vw, 42px); line-height: 1.08; margin-bottom: 16px; }
.cat-lead__title a:hover { color: var(--red); }
.cat-lead__dek { font-size: 17px; line-height: 1.55; color: var(--navy-70); }

/* ===== 신규: 기사 상세 ===== */
.article { max-width: 760px; margin: 0 auto; padding-top: 20px; }
.article__title { font-family: var(--serif); font-weight: 800; font-size: clamp(32px, 5vw, 52px); line-height: 1.06; letter-spacing: -0.01em; margin-bottom: 22px; }
.article__dek { font-size: 21px; line-height: 1.5; color: var(--navy-70); margin-bottom: 26px; }
.article__meta { display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: 0.04em; color: var(--navy-70); padding-bottom: 24px; border-bottom: 1px solid var(--navy-14); }
.article__meta-sep { color: var(--red); }
.article__figure { margin: 32px 0; }
.article__lead-quote { font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 1.4; border-left: 3px solid var(--red); padding-left: 24px; margin: 8px 0 32px; }
.article__body { }
.article__p { font-size: 18px; line-height: 1.8; margin-bottom: 24px; }
.article__p:first-child::first-letter { font-family: var(--serif); font-weight: 700; font-size: 64px; line-height: 0.8; float: left; padding: 6px 12px 0 0; color: var(--navy); }
.article__body.static .article__p:first-child::first-letter { font-size: inherit; float: none; padding: 0; font-weight: inherit; font-family: var(--sans); }
.article__credit { font-size: 12px; color: var(--navy-55); letter-spacing: 0.03em; padding-top: 28px; margin-top: 12px; border-top: 1px solid var(--navy-14); }
.related { margin-top: 8px; }

/* 빈 결과 / 백링크 */
.empty { font-family: var(--serif); font-size: 20px; color: var(--navy-70); padding: 24px 0; }
.backlink { color: var(--red); font-weight: 600; }
.backlink:hover { text-decoration: underline; }

/* ⑨ 푸터 */
.footer { background: var(--navy); color: var(--paper); margin-top: 64px; }
.footer__inner { display: grid; grid-template-columns: 1.2fr 2fr; gap: 56px; padding: 56px 24px 40px; }
.logo--footer { justify-content: flex-start; }
.logo--footer .logo__line, .logo--footer .logo__amp { color: var(--paper); font-size: 30px; }
.logo--footer .logo__amp { font-size: 26px; }
.footer__tagline { font-size: 13px; color: rgba(250,250,248,0.6); margin-top: 16px; letter-spacing: 0.04em; }
.footer__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.footer__h { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); padding-bottom: 14px; margin-bottom: 4px; border-bottom: 1px solid rgba(250,250,248,0.18); }
.footer__col a { display: block; padding: 7px 0; font-size: 14px; color: rgba(250,250,248,0.82); }
.footer__col a:hover { color: var(--paper); }
.footer__bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 22px 24px; border-top: 1px solid rgba(250,250,248,0.18); font-size: 12px; color: rgba(250,250,248,0.6); letter-spacing: 0.02em; }

/* 반응형 */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 36px; }
  .rail { border-left: 0; padding-left: 0; border-top: 2px solid var(--navy); padding-top: 28px; }
  .grid--3 { grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: 1fr; gap: 40px; }
  .cat-lead { grid-template-columns: 1fr; gap: 24px; }
  .footer__inner { grid-template-columns: 1fr; gap: 36px; }
}
@media (max-width: 640px) {
  .nav-toggle { display: flex; }
  .masthead__inner { padding: 20px 24px; }
  .nav__list { display: none; flex-direction: column; gap: 0; padding: 8px 0; }
  .nav.is-open .nav__list { display: flex; }
  .nav__link { padding: 14px 24px; text-align: left; }
  .nav__link::after { left: 24px; right: auto; width: 16px; bottom: 10px; }
  .grid--3 { grid-template-columns: 1fr; }
  .footer__cols { grid-template-columns: 1fr 1fr; }
  .utility__weather { display: none; }
  .lead__dek { font-size: 17px; }
  .article__p { font-size: 17px; }
  .searchbar__input { font-size: 18px; }
}

  </style>

  <script>
/* SONGDO & PEOPLE — 클라이언트 라우터
   해시 기반 라우팅으로 다중 페이지를 단일 파일에서 구현.
   GitHub Pages 등 정적 호스팅에서 서버 설정 없이 작동. */
(function () {
  "use strict";

  var ARTICLES = window.ARTICLES || [];
  var CATEGORIES = window.CATEGORIES || [];
  var view = document.getElementById("js-view");

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function fmtDate(iso) {
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }
  function byId(id) { return ARTICLES.filter(function (a) { return a.id === id; })[0]; }
  function inCat(slug) { return ARTICLES.filter(function (a) { return a.cat === slug; }); }
  function catName(slug) {
    var c = CATEGORIES.filter(function (x) { return x.slug === slug; })[0];
    return c ? c.name : slug;
  }

  /* 이미지 플레이스홀더 (정직한 자리표시 — 람스) */
  function ph(variant) {
    if (variant === "lead") {
      return '<svg class="ph ph--lead" viewBox="0 0 800 460" role="img" aria-label="기사 대표 이미지 자리"><rect width="800" height="460"/><line x1="60" y1="400" x2="240" y2="180"/><line x1="240" y1="180" x2="420" y2="300"/><line x1="420" y1="300" x2="600" y2="120"/><line x1="600" y1="120" x2="740" y2="220"/><circle cx="600" cy="120" r="6"/><circle cx="240" cy="180" r="6"/></svg>';
    }
    var v = (variant || 0) % 3;
    var inner = [
      '<line x1="40" y1="180" x2="160" y2="80"/><line x1="160" y1="80" x2="280" y2="150"/><line x1="280" y1="150" x2="360" y2="70"/>',
      '<circle cx="200" cy="120" r="60"/><line x1="80" y1="120" x2="140" y2="120"/><line x1="260" y1="120" x2="320" y2="120"/>',
      '<line x1="60" y1="60" x2="60" y2="180"/><line x1="140" y1="100" x2="140" y2="180"/><line x1="220" y1="40" x2="220" y2="180"/><line x1="300" y1="130" x2="300" y2="180"/>'
    ][v];
    return '<svg class="ph" viewBox="0 0 400 240" role="img" aria-label="이미지 자리"><rect width="400" height="240"/>' + inner + '</svg>';
  }

  /* 카드 컴포넌트 */
  function card(a, i) {
    return '<article class="card">' +
      '<figure class="card__figure"><a href="#/article/' + a.id + '">' + ph(i) + '</a></figure>' +
      '<span class="kicker kicker--sm">' + esc(a.catName) + '</span>' +
      '<h3 class="card__title"><a href="#/article/' + a.id + '">' + esc(a.title) + '</a></h3>' +
      '<p class="card__dek">' + esc(a.dek) + '</p>' +
      '</article>';
  }

  /* ---------- 페이지: 홈 ---------- */
  function renderHome() {
    var lead = ARTICLES.filter(function (a) { return a.lead; })[0] || ARTICLES[0];
    var feat = ARTICLES.filter(function (a) { return a.featured && a.id !== lead.id; });
    var rail = feat.slice(0, 3);
    var gridIds = ["decentralization-bill", "songdo-art-fair", "incheon-club-home"];
    var grid = gridIds.map(byId).filter(Boolean);
    var econ = inCat("economy").slice(0, 5);
    var world = inCat("world").slice(0, 5);
    var ops = inCat("opinion").slice(0, 3);

    var railHtml = rail.map(function (a, i) {
      var last = i === rail.length - 1 ? " rail__item--last" : "";
      return '<article class="rail__item' + last + '">' +
        '<span class="kicker kicker--sm">' + esc(a.catName) + '</span>' +
        '<h2 class="rail__title"><a href="#/article/' + a.id + '">' + esc(a.title) + '</a></h2>' +
        '<p class="rail__dek">' + esc(a.dek) + '</p></article>';
    }).join("");

    var listHtml = function (arr) {
      return arr.map(function (a, i) {
        var last = i === arr.length - 1 ? " list__item--last" : "";
        return '<li class="list__item' + last + '"><a href="#/article/' + a.id + '">' + esc(a.title) + '</a></li>';
      }).join("");
    };

    var opHtml = ops.map(function (a, i) {
      var last = i === ops.length - 1 ? " op--last" : "";
      return '<article class="op' + last + '">' +
        '<blockquote class="op__quote"><a href="#/article/' + a.id + '">' + esc(a.quote || a.title) + '</a></blockquote>' +
        '<p class="op__author">' + esc(a.author) + ' · ' + esc(a.kicker) + '</p></article>';
    }).join("");

    view.innerHTML =
      '<section class="hero" aria-label="주요 기사">' +
        '<article class="lead">' +
          '<span class="kicker">' + esc(lead.kicker) + '</span>' +
          '<h1 class="lead__title"><a href="#/article/' + lead.id + '">' + esc(lead.title) + '</a></h1>' +
          '<p class="lead__dek">' + esc(lead.dek) + '</p>' +
          '<figure class="lead__figure"><a href="#/article/' + lead.id + '">' + ph("lead") + '</a>' +
          '<figcaption class="figcaption">' + esc(lead.figcaption || "") + '</figcaption></figure>' +
          '<p class="byline">' + esc(lead.author) + ' 기자 · ' + fmtDate(lead.date) + '</p>' +
        '</article>' +
        '<aside class="rail" aria-label="보조 기사">' + railHtml + '</aside>' +
      '</section>' +

      '<section class="section" aria-label="주요 뉴스">' +
        '<div class="section__head"><h2 class="section__title">주요 뉴스</h2></div>' +
        '<div class="grid grid--3">' + grid.map(card).join("") + '</div>' +
      '</section>' +

      '<section class="section split" aria-label="경제와 국제">' +
        '<div class="split__col"><div class="section__head"><h2 class="section__title">경제</h2>' +
          '<a href="#/category/economy" class="section__more">전체 보기</a></div>' +
          '<ol class="list">' + listHtml(econ) + '</ol></div>' +
        '<div class="split__col"><div class="section__head"><h2 class="section__title">국제</h2>' +
          '<a href="#/category/world" class="section__more">전체 보기</a></div>' +
          '<ol class="list">' + listHtml(world) + '</ol></div>' +
      '</section>' +

      '<section class="section opinion" aria-label="오피니언">' +
        '<div class="section__head"><h2 class="section__title">오피니언</h2>' +
        '<a href="#/category/opinion" class="section__more">전체 보기</a></div>' +
        '<div class="grid grid--3">' + opHtml + '</div>' +
      '</section>';
  }

  /* ---------- 페이지: 카테고리 ---------- */
  function renderCategory(slug) {
    var name = catName(slug);
    var arts = inCat(slug);
    if (!arts.length) { return renderNotFound("‘" + name + "’ 섹션에 아직 기사가 없습니다."); }

    var top = arts[0];
    var rest = arts.slice(1);

    var topHtml = '<article class="cat-lead">' +
      '<figure class="cat-lead__figure"><a href="#/article/' + top.id + '">' + ph("lead") + '</a></figure>' +
      '<div class="cat-lead__body"><span class="kicker">' + esc(top.kicker) + '</span>' +
      '<h2 class="cat-lead__title"><a href="#/article/' + top.id + '">' + esc(top.title) + '</a></h2>' +
      '<p class="cat-lead__dek">' + esc(top.dek) + '</p>' +
      '<p class="byline">' + esc(top.author) + ' 기자 · ' + fmtDate(top.date) + '</p></div></article>';

    var restHtml = rest.length
      ? '<div class="grid grid--3">' + rest.map(card).join("") + '</div>'
      : '';

    view.innerHTML =
      '<nav class="crumb"><a href="#/">홈</a><span>›</span><strong>' + esc(name) + '</strong></nav>' +
      '<header class="page-head"><h1 class="page-head__title">' + esc(name) + '</h1>' +
      '<p class="page-head__count">' + arts.length + '건의 기사</p></header>' +
      topHtml +
      (restHtml ? '<section class="section">' + restHtml + '</section>' : '');
  }

  /* ---------- 페이지: 기사 상세 ---------- */
  function renderArticle(id) {
    var a = byId(id);
    if (!a) { return renderNotFound("요청하신 기사를 찾을 수 없습니다."); }

    var bodyHtml = (a.body || []).map(function (p) {
      return '<p class="article__p">' + esc(p) + '</p>';
    }).join("");

    var related = inCat(a.cat).filter(function (x) { return x.id !== a.id; }).slice(0, 3);
    var relHtml = related.length ? (
      '<section class="section related"><div class="section__head"><h2 class="section__title">' +
      esc(a.catName) + ' 더보기</h2></div><div class="grid grid--3">' +
      related.map(card).join("") + '</div></section>'
    ) : "";

    var quoteOpen = a.quote ? '<p class="article__lead-quote">“' + esc(a.quote) + '”</p>' : '';

    view.innerHTML =
      '<nav class="crumb"><a href="#/">홈</a><span>›</span>' +
      '<a href="#/category/' + a.cat + '">' + esc(a.catName) + '</a><span>›</span><strong>기사</strong></nav>' +
      '<article class="article">' +
        '<span class="kicker">' + esc(a.kicker) + '</span>' +
        '<h1 class="article__title">' + esc(a.title) + '</h1>' +
        '<p class="article__dek">' + esc(a.dek) + '</p>' +
        '<div class="article__meta"><span>' + esc(a.author) + ' 기자</span>' +
        '<span class="article__meta-sep">·</span><time>' + fmtDate(a.date) + '</time></div>' +
        '<figure class="article__figure">' + ph("lead") +
        (a.figcaption ? '<figcaption class="figcaption">' + esc(a.figcaption) + '</figcaption>' : '') +
        '</figure>' +
        quoteOpen +
        '<div class="article__body">' + bodyHtml + '</div>' +
        '<p class="article__credit">© SONGDO &amp; PEOPLE · 무단 전재 및 재배포 금지</p>' +
      '</article>' +
      relHtml;

    document.title = a.title + " — SONGDO & PEOPLE";
  }

  /* ---------- 페이지: 검색 ---------- */
  function renderSearch(q) {
    q = (q || "").trim();
    var results = [];
    if (q) {
      var lq = q.toLowerCase();
      results = ARTICLES.filter(function (a) {
        return (a.title + " " + a.dek + " " + (a.body || []).join(" ") + " " + a.catName)
          .toLowerCase().indexOf(lq) !== -1;
      });
    }
    var resHtml = results.length
      ? '<div class="grid grid--3">' + results.map(card).join("") + '</div>'
      : '<p class="empty">' + (q ? '‘' + esc(q) + '’에 대한 검색 결과가 없습니다.' : '검색어를 입력하세요.') + '</p>';

    view.innerHTML =
      '<header class="page-head"><h1 class="page-head__title">검색</h1>' +
      (q ? '<p class="page-head__count">‘' + esc(q) + '’ · ' + results.length + '건</p>' : '') +
      '</header><section class="section">' + resHtml + '</section>';
  }

  /* ---------- 페이지: 정적 (구독/소개) ---------- */
  function renderStatic(kind) {
    var data = {
      subscribe: { t: "구독 안내", p: ["송도앤피플은 신뢰받는 지역·국제 저널리즘을 지향합니다.", "정기 구독을 통해 심층 기사와 뉴스레터를 받아보실 수 있습니다.", "본 페이지는 데모용으로, 실제 결제 기능은 연결되어 있지 않습니다."] },
      about: { t: "회사 소개", p: ["송도앤피플은 인천 송도를 기반으로 지역과 세계를 잇는 뉴스를 전합니다.", "사실 확인과 공정 보도라는 원칙을 지키며, 독자의 신뢰를 최우선 가치로 삼습니다.", "제보·광고·채용 문의는 본 페이지를 통해 안내됩니다. (데모)"] }
    }[kind] || { t: "페이지", p: ["준비 중입니다."] };

    view.innerHTML =
      '<nav class="crumb"><a href="#/">홈</a><span>›</span><strong>' + esc(data.t) + '</strong></nav>' +
      '<header class="page-head"><h1 class="page-head__title">' + esc(data.t) + '</h1></header>' +
      '<div class="article__body static">' + data.p.map(function (p) {
        return '<p class="article__p">' + esc(p) + '</p>';
      }).join("") + '</div>';
  }

  function renderNotFound(msg) {
    view.innerHTML =
      '<header class="page-head"><h1 class="page-head__title">페이지를 찾을 수 없습니다</h1></header>' +
      '<p class="empty">' + esc(msg || "요청하신 페이지가 존재하지 않습니다.") + '</p>' +
      '<p class="empty"><a class="backlink" href="#/">← 홈으로 돌아가기</a></p>';
  }

  /* ---------- 라우터 ---------- */
  function parseQuery(str) {
    var out = {};
    (str || "").split("&").forEach(function (kv) {
      if (!kv) return;
      var p = kv.split("=");
      out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
    });
    return out;
  }

  function router() {
    var hash = location.hash.replace(/^#/, "");
    if (!hash || hash === "/") hash = "/";
    var qIndex = hash.indexOf("?");
    var query = "";
    if (qIndex !== -1) { query = hash.slice(qIndex + 1); hash = hash.slice(0, qIndex); }
    var parts = hash.split("/").filter(Boolean); // ["category","economy"]

    document.title = "SONGDO & PEOPLE — 송도앤피플";
    var activeCat = "home";

    if (parts.length === 0) {
      renderHome();
    } else if (parts[0] === "category" && parts[1]) {
      renderCategory(parts[1]); activeCat = parts[1];
    } else if (parts[0] === "article" && parts[1]) {
      var art = byId(parts[1]); if (art) activeCat = art.cat;
      renderArticle(parts[1]);
    } else if (parts[0] === "search") {
      renderSearch(parseQuery(query).q); activeCat = "search";
    } else if (parts[0] === "subscribe") {
      renderStatic("subscribe"); activeCat = "subscribe";
    } else if (parts[0] === "about") {
      renderStatic("about"); activeCat = "about";
    } else {
      renderNotFound();
    }

    setActiveNav(activeCat);
    closeMobileNav();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  /* ---------- 내비게이션 빌드 ---------- */
  function buildNav() {
    var ul = document.getElementById("js-nav-list");
    ul.innerHTML = CATEGORIES.map(function (c) {
      var href = c.slug === "home" ? "#/" : "#/category/" + c.slug;
      return '<li><a href="' + href + '" class="nav__link" data-cat="' + c.slug + '">' + esc(c.name) + '</a></li>';
    }).join("");
  }
  function setActiveNav(slug) {
    var links = document.querySelectorAll(".nav__link");
    links.forEach(function (l) {
      l.classList.toggle("is-active", l.getAttribute("data-cat") === slug);
    });
  }

  /* ---------- 속보 티커 ---------- */
  function buildTicker() {
    var items = ARTICLES.filter(function (a) { return a.featured; }).slice(0, 3);
    var html = items.map(function (a) {
      return '<a class="ticker__item" href="#/article/' + a.id + '">' + esc(a.title) + '</a>';
    }).join("");
    document.getElementById("js-ticker").innerHTML = html + html; // 무한 루프용 2배
  }

  /* ---------- 검색 패널 ---------- */
  function setupSearch() {
    var bar = document.getElementById("js-searchbar");
    var input = document.getElementById("js-search-input");
    var open = function () { bar.hidden = false; input.focus(); };
    var close = function () { bar.hidden = true; };
    var go = function () {
      var q = input.value.trim();
      close();
      location.hash = "#/search?q=" + encodeURIComponent(q);
    };
    document.getElementById("js-search-btn").addEventListener("click", open);
    document.getElementById("js-search-close").addEventListener("click", close);
    document.getElementById("js-search-go").addEventListener("click", go);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") go();
      if (e.key === "Escape") close();
    });
  }

  /* ---------- 모바일 메뉴 ---------- */
  function setupMobileNav() {
    var toggle = document.getElementById("js-nav-toggle");
    var nav = document.getElementById("js-nav");
    toggle.addEventListener("click", function () {
      var openNow = nav.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", openNow ? "true" : "false");
      toggle.setAttribute("aria-label", openNow ? "메뉴 닫기" : "메뉴 열기");
    });
  }
  function closeMobileNav() {
    var nav = document.getElementById("js-nav");
    var toggle = document.getElementById("js-nav-toggle");
    nav.classList.remove("is-open");
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-label", "메뉴 열기");
  }

  /* ---------- 날짜 ---------- */
  function setDate() {
    var el = document.getElementById("js-date");
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    var n = new Date();
    el.textContent = n.getFullYear() + "년 " + (n.getMonth() + 1) + "월 " + n.getDate() + "일 " + days[n.getDay()] + "요일";
  }

  /* ---------- 부트 ---------- */
  setDate();
  buildNav();
  buildTicker();
  setupSearch();
  setupMobileNav();
  window.addEventListener("hashchange", router);
  router();
})();

  </script>
</body>
</html>
